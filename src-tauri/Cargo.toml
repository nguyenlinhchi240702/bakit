[package]
name = "bakit"
version = "0.3.0"
description = "BAKit — chụp, sửa ảnh, ghi chú, việc, lịch và checklist dự án cho BA"
edition = "2021"

[lib]
name = "bakit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset", "image-png"] }
tauri-plugin-sql = { version = "2.6", features = ["sqlite"] }
tauri-plugin-fs = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.8"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
