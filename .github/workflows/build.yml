# Build BAKit for Windows (.exe/.msi) and macOS (.dmg, chip M + Intel) on every push to main,
# then publish them as a GitHub Release "BAKit vX.Y.Z" together with latest.json.
# The app's "Kiểm tra cập nhật" button reads that latest.json to update itself.
#
# Needs one repository secret (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY = contents of bakit-updater.key
# Bump "version" in package.json + src-tauri/tauri.conf.json for each new release.
name: Build BAKit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ''
            rust_targets: ''
          - name: macos
            os: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Cài thư viện
        run: npm install

      - name: Kiểm tra khóa ký bản cập nhật
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Chưa có secret TAURI_SIGNING_PRIVATE_KEY. Vào Settings → Secrets and variables → Actions → New repository secret, dán nội dung file bakit-updater.key."
            exit 1
          fi

      - name: Build và đăng bản phát hành
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: 'BAKit v__VERSION__'
          releaseBody: 'Tải file .dmg (Mac) hoặc _x64-setup.exe (Windows) ở mục Assets bên dưới. Đã cài BAKit rồi thì chỉ cần mở app → Cài đặt → Kiểm tra cập nhật.'
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
