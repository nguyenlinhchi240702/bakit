# Tự build BAKit cho Windows (.exe, .msi) và macOS (.dmg chạy được cả chip M lẫn Intel)
# mỗi khi đẩy code lên nhánh main, hoặc bấm "Run workflow" trong tab Actions.
# Đẩy tag dạng v0.1.1 thì file còn được đăng lên mục Releases của repo.
name: Build BAKit

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ''
            rust_targets: ''
          - name: macos
            os: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Cài thư viện
        run: npm install

      - name: Build app
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Tải file cài lên mục Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BAKit-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Đăng lên Releases (chỉ khi đẩy tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
